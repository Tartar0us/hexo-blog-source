# Hexo Configuration
## Docs: http://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: Hexo
subtitle: subtitle
description: 鎻忚堪123
keywords: 鍏抽敭璇?,鍏抽敭璇? # edit for Theme.shoka
author: John Doe
language: zh-CN # 杩欓噷鍙彲浠ラ€?zh-CN銆亃h-HK銆亃h-TW銆乯a銆乪n 杩欏嚑涓牸寮?
timezone: 'Asia/Shanghai'

# URL
## If your site is put in a subdirectory, set url as 'http://yoursite.com/child' and root as '/child/'
url: http://yoursite.com
root: /
permalink: :title/ # edit for Theme.shoka
permalink_defaults:

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
highlight:
  enable: false # edit for Theme.shoka
  line_number: true
  auto_detect: true
  tab_replace: ''
prismjs:
  enable: false # edit for Theme.shoka

# Category & Tag
default_category: uncategorized
category_map: # edit for Theme.shoka
  璁＄畻鏈虹瀛? computer-science
  Java: java
  浜岃繘鍒舵潅璋? note
  闆跺熀纭€瀛ava璇█-娴欐睙澶у-缈佹伜: course-1
  Theme Shoka Documentation: theme-shoka-doc
tag_map:

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Extensions
## Plugins: http://hexo.io/plugins/
## Themes: http://hexo.io/themes/
theme: shoka # edit for Theme.shoka

# Deployment
## Docs: http://hexo.io/docs/deployment.html
deploy:
  type:


# edit for Theme.shoka
autoprefixer:
  exclude:
    - '*.min.css'

markdown:
  render: # 娓叉煋鍣ㄨ缃?
    html: false # 杩囨护 HTML 鏍囩
    xhtmlOut: true # 浣跨敤 '/' 鏉ラ棴鍚堝崟鏍囩 锛堟瘮濡?<br />锛夈€?
    breaks: true # 杞崲娈佃惤閲岀殑 '\n' 鍒?<br>銆?
    linkify: true # 灏嗙被浼?URL 鐨勬枃鏈嚜鍔ㄨ浆鎹负閾炬帴銆?
    typographer:
    quotes: '鈥溾€濃€樷€?
  plugins: # markdown-it鎻掍欢璁剧疆
    - plugin:
        name: markdown-it-toc-and-anchor
        enable: true
        options: # 鏂囩珷鐩綍浠ュ強閿氱偣搴旂敤鐨刢lass鍚嶇О锛宻hoka涓婚蹇呴』璁剧疆鎴愯繖鏍?
          tocClassName: 'toc'
          anchorClassName: 'anchor'
    - plugin:
        name: markdown-it-multimd-table
        enable: true
        options:
          multiline: true
          rowspan: true
          headerless: true
    - plugin:
        name: ./markdown-it-furigana
        enable: true
        options:
          fallbackParens: "()"
    - plugin:
        name: ./markdown-it-spoiler
        enable: true
        options:
          title: "浣犵煡閬撳緱澶浜?

minify:
  html:
    enable: true
    stamp: false
    exclude:
      - '**/json.ejs'
      - '**/atom.ejs'
      - '**/rss.ejs'
  css:
    enable: true
    stamp: false
    exclude:
      - '**/*.min.css'
  js:
    enable: true
    stamp: false
    mangle:
      toplevel: true
    output:
    compress:
    exclude:
      - '**/*.min.js'

