# 尊者完整句池。顶部横幅会在构建时随机抽取一句。
quotes:
  - text: "落魄谷中寒風吹，春秋蟬鳴少年歸。"
    weight: 1
  - text: "盪魂山處石人淚，定仙遊走魔向北。"
    weight: 1
  - text: "逆流河上萬仙退，愛情不敵堅持淚。"
    weight: 1
  - text: "宿命天成命中敗，仙尊悔而我不悔。"
    weight: 1
  - text: "星火燎原耀中州，異人霸業就此收。"
    weight: 1
  - text: "一生不利己，憂濟在元元。"
    weight: 1
  - text: "鴻運齊天福祿多，天下不過一掌中。"
    weight: 1
  - text: "面朝黃土背朝天，萬千生靈繫心間。"
    weight: 1
  - text: "江山如畫馬如龍，青衫入世顯儀容。"
    weight: 1
  - text: "光陰長河種紅蓮，韶光重回淚已乾。"
    weight: 1
  - text: "變化萬千心如常，男兒何須把貌藏。"
    weight: 1
  - text: "魂牽夢繞風雲盪，心圓土方三界壇。"
    weight: 1
  - text: "從來是瘋魔道癡，俯仰問陰陽乾坤。"
    weight: 1
  - text: "大漠孤舟騎行忙，天外孤魂千段長。"
    weight: 1
  - text: "早歲已知世事艱，仍許飛鴻盪雲間。"
    weight: 1
  - text: "今朝劍指疊雲處，煉蠱煉人還煉天。"
    weight: 1
