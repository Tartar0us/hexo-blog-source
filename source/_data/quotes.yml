# 主页随机名言库（带概率权重）
# 格式: - text: "名言 —— 作者"
#        weight: 数字（权重越高，出现概率越大）
quotes:
  - text: "心平能愈三千疾"
    weight: 51

  - text: "高台藏鼠辈，乡野卧麒麟"
    weight: 5

  - text: "你所厌恶的今天，是昨日死去之人苦苦奢望的明天"
    weight: 5

  - text: "不要因为走得太远，而忘记为什么出发 —— 纪伯伦"
    weight: 5

  - text: "种一棵树最好的时间是十年前，其次是现在"
    weight: 5

  - text: "我们都是仰望星空的人，但有人脚踏实地 —— 奥斯卡·王尔德"
    weight: 5

  - text: "生活不是等待暴风雨过去，而是学会在雨中起舞"
    weight: 5

  - text: "人生没有彩排，每天都是现场直播"
    weight: 5

  - text: "走自己的路，让别人说去吧 —— 但丁"
    weight: 5

  - text: "读万卷书，行万里路"
    weight: 5

  - text: "知之者不如好之者，好之者不如乐之者 —— 孔子"
    weight: 4
