# 尊者短句池。顶部横幅会在构建时随机抽取一句。
quotes:
  - text: "星火燎原耀中州。"
    weight: 1
  - text: "一生不利己，憂濟在元元。"
    weight: 1
  - text: "從來是瘋魔道癡。"
    weight: 1
  - text: "變化萬千心如常。"
    weight: 1
  - text: "光陰長河種紅蓮。"
    weight: 1
  - text: "江山如畫馬如龍。"
    weight: 1
  - text: "踏遍萬里尋歸途。"
    weight: 1
  - text: "鴻運齊天福祿多。"
    weight: 1
  - text: "一念陰陽倒時差。"
    weight: 1
  - text: "萬千生靈繫心間。"
    weight: 1
  - text: "煉蠱煉人還煉天。"
    weight: 1
